# Publishes the game to GitHub Pages so anyone can play online with a link.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (game files only; skip the source models)
        run: |
          mkdir -p _site/assets
          cp index.html style.css game.js _site/
          cp assets/survivor.glb assets/monster.glb assets/bridge1.glb assets/bridge2.glb _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
